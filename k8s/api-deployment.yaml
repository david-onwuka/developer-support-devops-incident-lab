apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-api
  template:
    metadata:
      labels:
        app: support-api
    spec:
      containers:
        - name: api
          image: ghcr.io/david-onwuka/developer-support-devops-incident-lab:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: support-db-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: support-api
spec:
  selector:
    app: support-api
  ports:
    - port: 8000
      targetPort: 8000
  type: NodePort
