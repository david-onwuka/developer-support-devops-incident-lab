services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://support_user:change_me_local@db:5432/support_lab
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: change_me_local
      POSTGRES_DB: support_lab
    ports:
      - "5545:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_user -d support_lab"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
