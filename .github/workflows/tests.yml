name: Developer Support Incident Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support_user
          POSTGRES_PASSWORD: change_me_local
          POSTGRES_DB: support_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_user -d support_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://support_user:change_me_local@localhost:5432/support_lab
        run: |
          python -c "import os, psycopg; conn=psycopg.connect(os.environ['DATABASE_URL']); conn.execute(open('init.sql').read()); conn.commit(); conn.close()"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://support_user:change_me_local@localhost:5432/support_lab
        run: pytest -v
